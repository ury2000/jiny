[package]
name = "jiny-desktop"
version = "0.5.0"
edition = "2021"
description = "Native Desktop Companion for Jiny (WoW Classic Forever 1.15.x)"

[dependencies]
eframe = "0.30"
arboard = "3.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11"
reqwest = { version = "0.12", features = ["json", "blocking"] }
